# Balanced mobile-manipulator profile. Hardware motion still requires user testing.
# Previous settings: Station .08 m/s, spin .30 rad/s, guard .10/.35,
# accel .15/.4, approach slowdown .30 m, manager settle .35 s.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    StationPath:
      desired_linear_vel: 0.16
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.18
      rotate_to_heading_angular_vel: 0.50
      max_angular_accel: 0.8
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
    ApproachPath:
      desired_linear_vel: 0.08
      approach_velocity_scaling_dist: 0.18
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 0.8
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.18, 0.0, 0.60]
    min_velocity: [-0.05, 0.0, -0.60]
    max_accel: [0.30, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -1.2]
    velocity_timeout: 0.25
behavior_server:
  ros__parameters:
    cycle_frequency: 20.0
    max_rotational_vel: 0.55
    rotational_acc_lim: 0.8
motion_guard:
  ros__parameters:
    max_linear_velocity: 0.18
    max_reverse_velocity: 0.05
    max_angular_velocity: 0.60
    linear_acceleration: 0.30
    angular_acceleration: 0.8
motion_executor:
  ros__parameters:
    spin_max_velocity: 0.55
    spin_gain: 2.0
    spin_acceleration: 0.8
    readiness_hold: 0.30
    rotation_settle: 0.15
    reuse_stationary_readiness: true
diff_drive_controller:
  ros__parameters:
    linear.x.max_velocity: 0.18
    linear.x.min_velocity: -0.05
    linear.x.max_acceleration: 0.30
    linear.x.min_acceleration: -0.5
    angular.z.max_velocity: 0.60
    angular.z.min_velocity: -0.60
    angular.z.max_acceleration: 0.8
    angular.z.min_acceleration: -1.2
aruco_localizer:
  ros__parameters:
    image_processing_rate: 10.0
obstacle_depth:
  ros__parameters:
    carry_clear_all_obstacles: true
    # Parked, encoder-verified carried object only; base_link metres.
    carry_mask_min: [0.06, -0.09, 0.16]
    carry_mask_max: [0.18, 0.09, 0.35]
    publish_rate: 10.0
    stride: 8
cleanup_task_manager:
  ros__parameters:
    # The executor confirms nonempty fingers after lift and park. Camera can be occluded.
    verify_pick_with_camera: false
    scan_settle_seconds: 0.10
    # Capture timestamp includes YOLO/SAM/geometry/evidence processing (~2.1s observed).
    target_max_age: 6.0
scan_perception_node:
  ros__parameters:
    # Only a fully negative heading exits early. Positive targets keep 3 confirmations.
    empty_scene_frames: 2
    grasp_min_body_depth: 0.004
pick_and_place_action_node:
  ros__parameters:
    target_max_age: 6.0
    startup_park: false
    reached_joint_tolerance: 0.015
    # Grasp quality threshold, independent of the unchanged finger/floor limits.
    grasp_min_body_depth: 0.004
    # Recheck actual arrival geometry instead of rejecting a hypothetical +2cm error.
    approach_error_margin: 0.0
    # Match Nav2 manipulation_goal_checker; avoid retrying an already-reached pose.
    approach_goal_tolerance: 0.02
performance_safety:
  ros__parameters:
    # Model includes stale-sensor threshold + processing/control allowance.
    reaction_seconds: 0.70
    braking_deceleration: 0.50
    margin_metres: 0.05
    collision_horizon_seconds: 1.5
collision_monitor:
  ros__parameters:
    source_timeout: 0.6
    ApproachFootprint:
      time_before_collision: 1.5
