cleanup:
  # Set this to true only after teaching a safe base pose beside the collection bin.
  drop_pose:
    configured: false
    x: 1.0
    y: -0.5
    yaw: 0.0

  # The mobile base stops this far from the detected object before grasping.
  approach_standoff: 0.24
  target_max_age: 1.0
  target_min_distance: 0.15
  target_max_distance: 2.0
  target_cooldown: 5.0
